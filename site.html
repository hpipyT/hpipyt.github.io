<!DOCTYPE html>
<html>
<head>
<title>Parallax Demo</title>
<style>
	:root {
		--bg: #f4f1ea;
		--ink: #1f2937;
		--accent: #c2410c;
		--surface: #fff;
		--muted: #4b5563;
		--slide-speed-ms: 920ms;
	}

	* {
		box-sizing: border-box;
	}

	body {
		margin: 0;
		font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
		color: var(--ink);
		background: var(--bg);
		line-height: 1.6;
		overflow-x: hidden;
	}

	.hero {
		min-height: 100vh;
		display: grid;
		place-items: center;
		padding: 2rem;
		text-align: center;
		background: linear-gradient(130deg, #fffaf0 0%, #f5d0a9 100%);
		position: relative;
		overflow: hidden;
	}

	.hero-copy {
		position: relative;
		z-index: 2;
	}

	.tessellation-layer {
		position: absolute;
		inset: 0;
		width: 100%;
		height: 100%;
		z-index: 1;
		pointer-events: none;
		overflow: hidden;
	}

	.parallax-shard-layer {
		z-index: 4;
	}

	.tess-piece {
		position: absolute;
		image-rendering: auto;
		transform-origin: center center;
		transition: transform 60ms linear, opacity 100ms linear;
		will-change: transform, opacity;
	}

	.hero h1 {
		margin: 0;
		font-size: clamp(2rem, 6vw, 4rem);
		letter-spacing: 0.04em;
	}

	.hero p {
		max-width: 60ch;
		margin: 1rem auto 0;
		font-size: clamp(1rem, 2.5vw, 1.25rem);
	}

	.parallax {
		position: relative;
		min-height: 72vh;
		--parallax-shift: 0;
		transition: min-height var(--slide-speed-ms) ease;
		background-attachment: fixed;
		display: grid;
		place-items: center;
		padding: 1.5rem clamp(2.8rem, 8vw, 5.5rem) 5.2rem;
		overflow: hidden;
	}

	.parallax.expanded {
		height: 100vh;
		min-height: 100vh;
	}

	.parallax-media {
		position: absolute;
		inset: 0;
		z-index: 0;
	}

	.parallax-media iframe {
		position: absolute;
		inset: 0;
		width: 100%;
		height: 100%;
		border: 0;
		pointer-events: none;
		filter: saturate(0.82) brightness(0.52) contrast(1.06);
		transform: translateY(calc(var(--parallax-shift) * 1px)) scale(1.12);
	}

	.parallax-fade {
		position: absolute;
		inset: 0;
		background:
			radial-gradient(circle at 50% 38%, rgb(255 255 255 / 0.12), transparent 54%),
			linear-gradient(130deg, rgb(31 41 55 / 0.68), rgb(146 64 14 / 0.52));
		z-index: 1;
		pointer-events: none;
	}

	.video-title {
		margin: 0 0 0.55rem;
		color: #fff;
		font-size: clamp(1rem, 1.8vw, 1.35rem);
	}

	.repo-carousel {
		position: absolute;
		left: 50%;
		bottom: 0.95rem;
		transform: translateX(-50%);
		z-index: 6;
		display: flex;
		gap: 0;
		overflow: hidden;
		border: 1px solid #fdba74;
		border-radius: 0.72rem;
		background: #fff7ed;
		width: min(35vw, 700px);
		min-width: min(540px, calc(100vw - 2.8rem));
		max-width: calc(100vw - 2.2rem);
	}

	.side-arrow {
		position: absolute;
		top: 50%;
		transform: translateY(-50%);
		width: 2.7rem;
		height: 2.7rem;
		border: 0;
		border-radius: 999px;
		background: rgb(255 247 237 / 0.92);
		color: #7c2d12;
		font-size: 1.4rem;
		line-height: 1;
		cursor: pointer;
		box-shadow: 0 6px 16px rgb(0 0 0 / 0.22);
		transition: transform 140ms ease, background-color 140ms ease;
		z-index: 7;
	}

	.side-arrow:hover {
		background: #fdba74;
		transform: translateY(-50%) scale(1.04);
	}

	.side-arrow.left {
		left: 0.9rem;
	}

	.side-arrow.right {
		right: 0.9rem;
	}

	.content {
		min-height: 40vh;
		padding: 0.5rem 1.25rem 3rem;
		display: grid;
		place-items: center;
	}

	.content-shell {
		width: min(1080px, 96vw);
		background: var(--surface);
		border-radius: 0.85rem;
		padding: 1.2rem;
		box-shadow: 0 10px 30px rgb(0 0 0 / 0.08);
	}

	.content-shell h2 {
		margin: 0;
		font-size: 1.2rem;
		text-align: center;
	}

	.content-shell p {
		margin: 0.35rem 0 1rem;
		color: var(--muted);
		font-size: 0.95rem;
		text-align: center;
	}

	.repo-button {
		border: 0;
		border-right: 1px solid #fdba74;
		background: #ffedd5;
		color: #9a3412;
		padding: 0.7rem 0.2rem;
		font-size: 0.86rem;
		font-weight: 600;
		cursor: pointer;
		white-space: nowrap;
		flex: 0.35 1 0;
		min-width: 0;
		transition: flex 210ms ease, background-color 160ms ease, color 160ms ease, padding 210ms ease;
		overflow: hidden;
		display: flex;
		align-items: center;
		justify-content: center;
	}

	.repo-button:last-child {
		border-right: 0;
	}

	.repo-button .repo-full {
		display: block;
		overflow: hidden;
		text-overflow: ellipsis;
		opacity: 0;
		transition: opacity 130ms ease;
		width: 100%;
		text-align: left;
	}

	.repo-button.active,
	.repo-button.hovered {
		justify-content: flex-start;
		padding-left: 0.8rem;
	}

	.repo-button.active {
		background: #fdba74;
		color: #7c2d12;
		font-weight: 700;
	}

	.repo-button.hovered {
		justify-content: flex-start;
		padding-left: 0.8rem;
		background: #fed7aa;
		color: #7c2d12;
	}

	.repo-button.active .repo-full,
	.repo-button.hovered .repo-full {
		opacity: 1;
	}

	.repo-meta {
		margin-top: 1rem;
		font-weight: 700;
		font-size: 1rem;
	}

	.repo-link {
		display: inline-block;
		margin-top: 0.35rem;
		text-decoration: none;
		color: #9a3412;
		font-weight: 600;
	}

	.readme {
		margin-top: 0.9rem;
		padding: 1rem;
		border-radius: 0.7rem;
		background: #fffdf7;
		border: 1px solid #f3e8d4;
		max-height: 38vh;
		overflow: auto;
		white-space: pre-wrap;
		font-size: 0.92rem;
	}

	.readme.loading {
		color: #6b7280;
		font-style: italic;
	}

	@media (max-width: 900px) {
		.parallax {
			background-attachment: scroll;
			padding: 1.25rem 1rem 1.5rem;
		}

		.repo-carousel {
			width: calc(100vw - 1.5rem);
			min-width: 0;
			max-width: calc(100vw - 1.5rem);
			bottom: 0.35rem;
		}

		.side-arrow {
			top: auto;
			bottom: 3.35rem;
			transform: none;
		}

		.side-arrow:hover {
			transform: scale(1.04);
		}
	}
</style>
</head>
<body>
	<section class="hero">
		<div id="tessellationLayer" class="tessellation-layer" aria-hidden="true"></div>
		<div class="hero-copy">
			<h1>Parallax Scroll Effect</h1>
			<p>Scroll down to see the background move at a different pace than the content.</p>
		</div>
	</section>

	<section id="videoParallax" class="parallax" aria-label="Parallax video section">
		<div class="parallax-media" aria-hidden="true">
			<iframe
				id="videoPlayer"
				src="https://www.youtube.com/embed/dQw4w9WgXcQ?enablejsapi=1&playsinline=1&rel=0&modestbranding=1"
				title="Project video"
				allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
				allowfullscreen
			></iframe>
		</div>
		<div class="parallax-fade" aria-hidden="true"></div>
		<div id="parallaxShardLayer" class="tessellation-layer parallax-shard-layer" aria-hidden="true"></div>
		<button id="prevBtn" class="side-arrow left" type="button" aria-label="Previous repository">&#8249;</button>
		<div id="repoCarousel" class="repo-carousel" aria-label="Repository buttons"></div>
		<button id="nextBtn" class="side-arrow right" type="button" aria-label="Next repository">&#8250;</button>
	</section>

	<section class="content">
		<div class="content-shell">
			<h2>Repository Details</h2>
			<p>Choose a cell from the player footer to switch video and README.</p>
			<div id="repoMeta" class="repo-meta" aria-live="polite"></div>
			<a id="repoLink" class="repo-link" href="#" target="_blank" rel="noopener noreferrer">Open repository</a>
			<div id="readmeText" class="readme loading">Loading README...</div>
		</div>
	</section>

	<script>
		const candidateUsers = ["hpipyT", "Hpipyt", "hpipy"];
		const fallbackEmbedIds = ["dQw4w9WgXcQ", "ysz5S6PUM-U", "tgbNymZ7vqY"];
		const SLIDE_SPEED_MS = 920;
		const TESSELLATION_IMAGE_CANDIDATES = [
			"assets/images/tesellation.png",
			"assets/images/tesellation.jpg",
			"assets/images/tessellation.png",
			"assets/images/tessellation.jpg",
			"tesellation.png",
			"tesellation.jpg",
			"tessellation.png",
			"tessellation.jpg"
		];

		const parallaxSection = document.getElementById("videoParallax");
		const videoPlayer = document.getElementById("videoPlayer");
		const repoCarousel = document.getElementById("repoCarousel");
		const repoMeta = document.getElementById("repoMeta");
		const repoLink = document.getElementById("repoLink");
		const readmeText = document.getElementById("readmeText");
		const tessellationLayer = document.getElementById("tessellationLayer");
		const parallaxShardLayer = document.getElementById("parallaxShardLayer");
		const heroSection = document.querySelector(".hero");
		const prevBtn = document.getElementById("prevBtn");
		const nextBtn = document.getElementById("nextBtn");

		const readmeCache = new Map();
		const videoCache = new Map();
		let current = 0;
		let repoVideos = [];
		let autoSnapCooldown = false;
		let lastScrollY = window.scrollY;
		let hoveredIndex = -1;
		let renderToken = 0;
		let isExpanded = false;
		let isPlaying = false;
		let expandedLockScrollY = 0;
		let isProgrammaticScroll = false;
		const tessellationPieces = [];
		let tessellationBuildToken = 0;
		let activeEmbedBase = "https://www.youtube.com/embed/dQw4w9WgXcQ";
		const ACTIVE_WIDTH = 12;
		const COLLAPSED_WIDTH = 0.35;
		const SHRUNK_ACTIVE_WIDTH = ACTIVE_WIDTH * 0.5;

		function normalizeIndex(index) {
			const total = repoVideos.length;
			return (index + total) % total;
		}

		function embedFromVideoId(videoId) {
			return `https://www.youtube.com/embed/${videoId}`;
		}

		function parseEmbedVideoId(embedUrl) {
			const match = embedUrl.match(/\/embed\/([^?&]+)/i);
			return match ? match[1] : null;
		}

		function buildEmbedUrl(base, autoplay) {
			const suffix = autoplay
				? "?autoplay=1&enablejsapi=1&playsinline=1&rel=0&modestbranding=1"
				: "?enablejsapi=1&playsinline=1&rel=0&modestbranding=1";
			return `${base}${suffix}`;
		}

		function escapeHtml(text) {
			const span = document.createElement("span");
			span.textContent = text;
			return span.innerHTML;
		}

		function extractYoutubeId(url) {
			if (!url) {
				return null;
			}

			try {
				const parsed = new URL(url);
				const host = parsed.hostname.replace("www.", "").toLowerCase();

				if (host === "youtu.be") {
					return parsed.pathname.slice(1) || null;
				}

				if (host === "youtube.com" || host === "m.youtube.com") {
					if (parsed.pathname === "/watch") {
						return parsed.searchParams.get("v");
					}
					if (parsed.pathname.startsWith("/embed/")) {
						return parsed.pathname.split("/")[2] || null;
					}
				}
			} catch (error) {
				return null;
			}

			return null;
		}

		function decodeBase64Utf8(base64Value) {
			const raw = atob(base64Value);
			const bytes = Uint8Array.from(raw, (char) => char.charCodeAt(0));
			return new TextDecoder("utf-8").decode(bytes);
		}

		function updateButtonState() {
			const buttons = repoCarousel.querySelectorAll(".repo-button");
			buttons.forEach((button, index) => {
				button.classList.toggle("active", index === current);
				button.classList.toggle("hovered", index === hoveredIndex && hoveredIndex !== current);

				let width = COLLAPSED_WIDTH;
				if (hoveredIndex !== -1 && hoveredIndex !== current) {
					if (index === hoveredIndex) {
						width = ACTIVE_WIDTH;
					} else if (index === current) {
						width = SHRUNK_ACTIVE_WIDTH;
					}
				} else if (index === current) {
					width = ACTIVE_WIDTH;
				}
				button.style.flex = `${width} 1 0`;
			});
		}

		async function getReadme(repo) {
			const key = `${repo.owner}/${repo.name}`;
			if (readmeCache.has(key)) {
				return readmeCache.get(key);
			}

			try {
				const response = await fetch(`https://api.github.com/repos/${repo.owner}/${repo.name}/readme`);
				if (!response.ok) {
					throw new Error("README not found");
				}

				const payload = await response.json();
				const content = payload.content ? decodeBase64Utf8(payload.content.replace(/\n/g, "")) : "README unavailable.";
				readmeCache.set(key, content);
				return content;
			} catch (error) {
				const fallback = "README not available for this repository.";
				readmeCache.set(key, fallback);
				return fallback;
			}
		}

		async function resolveVideoEmbed(repo, index) {
			const key = `${repo.owner}/${repo.name}`;
			if (videoCache.has(key)) {
				return videoCache.get(key);
			}

			const homepageId = extractYoutubeId(repo.homepage || "");
			if (homepageId) {
				const homepageEmbed = embedFromVideoId(homepageId);
				videoCache.set(key, homepageEmbed);
				return homepageEmbed;
			}

			const readme = await getReadme(repo);
			const match = readme.match(/https?:\/\/(?:www\.)?(?:youtube\.com\/watch\?v=[^\s)\]]+|youtu\.be\/[^\s)\]]+|youtube\.com\/embed\/[^\s)\]]+)/i);
			const readmeId = match ? extractYoutubeId(match[0]) : null;
			const embed = readmeId
				? embedFromVideoId(readmeId)
				: embedFromVideoId(fallbackEmbedIds[index % fallbackEmbedIds.length]);
			videoCache.set(key, embed);
			return embed;
		}

		function sendPlayerCommand(command) {
			videoPlayer.contentWindow?.postMessage(
				JSON.stringify({
					event: "command",
					func: command,
					args: []
				}),
				"*"
			);
		}

		function smoothScrollTo(targetY, duration = SLIDE_SPEED_MS) {
			const startY = window.scrollY;
			const delta = targetY - startY;
			if (Math.abs(delta) < 2) {
				return Promise.resolve();
			}

			return new Promise((resolve) => {
				const start = performance.now();
				function tick(now) {
					const t = Math.min(1, (now - start) / duration);
					const eased = 1 - Math.pow(1 - t, 3);
					window.scrollTo(0, startY + delta * eased);
					if (t < 1) {
						requestAnimationFrame(tick);
					} else {
						resolve();
					}
				}
				requestAnimationFrame(tick);
			});
		}

		async function centerPlayerInView() {
			const top = parallaxSection.offsetTop;
			const sectionHeight = parallaxSection.offsetHeight;
			const targetY = Math.max(0, top + sectionHeight / 2 - window.innerHeight / 2);
			isProgrammaticScroll = true;
			await smoothScrollTo(targetY, SLIDE_SPEED_MS);
			expandedLockScrollY = window.scrollY;
			setTimeout(() => {
				isProgrammaticScroll = false;
			}, 40);
		}

		function setExpandedState(nextExpanded) {
			isExpanded = nextExpanded;
			parallaxSection.classList.toggle("expanded", nextExpanded);
		}

		function pauseAndCollapse() {
			if (!isExpanded) {
				return;
			}
			sendPlayerCommand("pauseVideo");
			isPlaying = false;
			setExpandedState(false);
		}

		async function expandAndPlay() {
			setExpandedState(true);
			videoPlayer.src = buildEmbedUrl(activeEmbedBase, true);
			isPlaying = true;
			await centerPlayerInView();
		}

		function togglePlayPauseInExpanded() {
			if (!isExpanded) {
				expandAndPlay();
				return;
			}
			if (isPlaying) {
				sendPlayerCommand("pauseVideo");
				isPlaying = false;
			} else {
				sendPlayerCommand("playVideo");
				isPlaying = true;
			}
		}

		async function render() {
			if (!repoVideos.length) {
				return;
			}

			const token = ++renderToken;

			const active = repoVideos[current];
			repoMeta.textContent = active.description || "No repository description available.";
			repoLink.href = active.repoUrl;
			repoLink.textContent = `Open ${active.name} on GitHub`;

			hoveredIndex = -1;
			updateButtonState();

			readmeText.classList.add("loading");
			readmeText.textContent = "Loading README...";

			const embed = await resolveVideoEmbed(active, current);
			if (token !== renderToken) {
				return;
			}

			activeEmbedBase = embed;
			videoPlayer.src = buildEmbedUrl(activeEmbedBase, isExpanded);
			isPlaying = isExpanded;
			videoPlayer.title = `${active.name} video`;

			const readme = await getReadme(active);
			if (token !== renderToken) {
				return;
			}
			readmeText.classList.remove("loading");
			readmeText.innerHTML = escapeHtml(readme);
		}

		function move(step) {
			if (!repoVideos.length) {
				return;
			}
			current = normalizeIndex(current + step);
			render();
		}

		function snapToParallaxOnThreshold() {
			const currentY = window.scrollY;
			const scrollingDown = currentY > lastScrollY;
			lastScrollY = currentY;

			if (!scrollingDown || autoSnapCooldown) {
				return;
			}

			const rect = parallaxSection.getBoundingClientRect();
			const inThreshold = rect.top <= window.innerHeight * 0.72 && rect.top >= window.innerHeight * 0.46;
			if (inThreshold) {
				autoSnapCooldown = true;
				const absoluteStageCenter = window.scrollY + rect.top + rect.height / 2;
				const targetY = Math.max(0, absoluteStageCenter - window.innerHeight / 2);
				isProgrammaticScroll = true;
				smoothScrollTo(targetY, SLIDE_SPEED_MS).then(() => {
					isProgrammaticScroll = false;
					autoSnapCooldown = false;
				});
			}
		}

		function hairlineCollapseOnScrollAway() {
			if (!isExpanded || isProgrammaticScroll) {
				return;
			}
			const drift = Math.abs(window.scrollY - expandedLockScrollY);
			if (drift > 0.1) {
				pauseAndCollapse();
			}
		}

		function clearTessellation() {
			if (!tessellationLayer) {
				return;
			}

			tessellationLayer.innerHTML = "";
			if (parallaxShardLayer) {
				parallaxShardLayer.innerHTML = "";
			}
			tessellationPieces.length = 0;
		}

		function clamp(value, min, max) {
			return Math.max(min, Math.min(max, value));
		}

		function buildFallbackTessellation() {
			clearTessellation();

			const rows = 10;
			const cols = 16;
			for (let row = 0; row < rows; row += 1) {
				for (let col = 0; col < cols; col += 1) {
					const piece = document.createElement("div");
					piece.className = "tess-piece";
					piece.style.left = `${(col / cols) * 100}%`;
					piece.style.top = `${(row / rows) * 100}%`;
					piece.style.width = `${100 / cols}%`;
					piece.style.height = `${100 / rows}%`;
					piece.style.background = "rgb(255 255 255 / 0.95)";
					piece.style.border = "1px solid rgb(0 0 0 / 0.7)";
					const overlay = piece.cloneNode(true);
					if (parallaxShardLayer) {
						parallaxShardLayer.appendChild(overlay);
					}
					tessellationLayer.appendChild(piece);
					tessellationPieces.push({
						heroEl: piece,
						parallaxEl: overlay,
						yNorm: (row + 0.5) / rows,
						jitter: ((row * cols + col) % 11) / 10
					});
				}
			}
		}

		function extractPiecesFromImage(img, buildToken) {
			if (!tessellationLayer || buildToken !== tessellationBuildToken) {
				return;
			}

			clearTessellation();

			const maxW = 520;
			const scale = Math.min(1, maxW / img.naturalWidth);
			const w = Math.max(120, Math.floor(img.naturalWidth * scale));
			const h = Math.max(80, Math.floor(img.naturalHeight * scale));

			const srcCanvas = document.createElement("canvas");
			srcCanvas.width = w;
			srcCanvas.height = h;
			const srcCtx = srcCanvas.getContext("2d", { willReadFrequently: true });
			if (!srcCtx) {
				buildFallbackTessellation();
				return;
			}

			srcCtx.drawImage(img, 0, 0, w, h);
			const srcImage = srcCtx.getImageData(0, 0, w, h);
			const srcData = srcImage.data;
			const size = w * h;
			const boundary = new Uint8Array(size);
			const visited = new Uint8Array(size);

			for (let y = 0; y < h; y += 1) {
				for (let x = 0; x < w; x += 1) {
					const i = y * w + x;
					const p = i * 4;
					const r = srcData[p];
					const g = srcData[p + 1];
					const b = srcData[p + 2];
					const luma = 0.2126 * r + 0.7152 * g + 0.0722 * b;
					if (luma < 88) {
						boundary[i] = 1;
					}
				}
			}

			const components = [];
			const queue = new Int32Array(size);

			for (let sy = 0; sy < h; sy += 1) {
				for (let sx = 0; sx < w; sx += 1) {
					const start = sy * w + sx;
					if (boundary[start] || visited[start]) {
						continue;
					}

					let head = 0;
					let tail = 0;
					queue[tail++] = start;
					visited[start] = 1;

					const pixels = [];
					let minX = sx;
					let maxX = sx;
					let minY = sy;
					let maxY = sy;
					let sumY = 0;

					while (head < tail) {
						const idx = queue[head++];
						const x = idx % w;
						const y = (idx - x) / w;
						pixels.push(idx);
						sumY += y;

						if (x < minX) minX = x;
						if (x > maxX) maxX = x;
						if (y < minY) minY = y;
						if (y > maxY) maxY = y;

						const left = idx - 1;
						const right = idx + 1;
						const up = idx - w;
						const down = idx + w;

						if (x > 0 && !visited[left] && !boundary[left]) {
							visited[left] = 1;
							queue[tail++] = left;
						}
						if (x < w - 1 && !visited[right] && !boundary[right]) {
							visited[right] = 1;
							queue[tail++] = right;
						}
						if (y > 0 && !visited[up] && !boundary[up]) {
							visited[up] = 1;
							queue[tail++] = up;
						}
						if (y < h - 1 && !visited[down] && !boundary[down]) {
							visited[down] = 1;
							queue[tail++] = down;
						}
					}

					if (pixels.length < 18) {
						continue;
					}

					components.push({
						pixels,
						minX,
						maxX,
						minY,
						maxY,
						yNorm: (sumY / pixels.length) / h
					});
				}
			}

			components.sort((a, b) => b.pixels.length - a.pixels.length);
			const selected = components.slice(0, 340);

			for (let i = 0; i < selected.length; i += 1) {
				const comp = selected[i];
				const pad = 1;
				const boxW = comp.maxX - comp.minX + 1 + pad * 2;
				const boxH = comp.maxY - comp.minY + 1 + pad * 2;

				const localMask = new Uint8Array(boxW * boxH);
				for (const idx of comp.pixels) {
					const px = idx % w;
					const py = (idx - px) / w;
					const lx = px - comp.minX + pad;
					const ly = py - comp.minY + pad;
					localMask[ly * boxW + lx] = 1;
				}

				const pieceCanvas = document.createElement("canvas");
				pieceCanvas.width = boxW;
				pieceCanvas.height = boxH;
				const pctx = pieceCanvas.getContext("2d", { willReadFrequently: true });
				if (!pctx) {
					continue;
				}

				const pieceImg = pctx.createImageData(boxW, boxH);
				const pieceData = pieceImg.data;

				for (let ly = 0; ly < boxH; ly += 1) {
					for (let lx = 0; lx < boxW; lx += 1) {
						const gx = comp.minX + lx - pad;
						const gy = comp.minY + ly - pad;
						if (gx < 0 || gy < 0 || gx >= w || gy >= h) {
							continue;
						}

						const li = ly * boxW + lx;
						const include =
							localMask[li]
							|| (lx > 0 && localMask[li - 1])
							|| (lx < boxW - 1 && localMask[li + 1])
							|| (ly > 0 && localMask[li - boxW])
							|| (ly < boxH - 1 && localMask[li + boxW]);
						if (!include) {
							continue;
						}

						const srcI = (gy * w + gx) * 4;
						const outI = li * 4;
						pieceData[outI] = srcData[srcI];
						pieceData[outI + 1] = srcData[srcI + 1];
						pieceData[outI + 2] = srcData[srcI + 2];
						pieceData[outI + 3] = 255;
					}
				}

				pctx.putImageData(pieceImg, 0, 0);
				pieceCanvas.className = "tess-piece";
				pieceCanvas.style.left = `${((comp.minX - pad) / w) * 100}%`;
				pieceCanvas.style.top = `${((comp.minY - pad) / h) * 100}%`;
				pieceCanvas.style.width = `${(boxW / w) * 100}%`;
				pieceCanvas.style.height = `${(boxH / h) * 100}%`;

				const overlayCanvas = document.createElement("canvas");
				overlayCanvas.width = boxW;
				overlayCanvas.height = boxH;
				overlayCanvas.className = "tess-piece";
				overlayCanvas.style.left = pieceCanvas.style.left;
				overlayCanvas.style.top = pieceCanvas.style.top;
				overlayCanvas.style.width = pieceCanvas.style.width;
				overlayCanvas.style.height = pieceCanvas.style.height;
				const octx = overlayCanvas.getContext("2d");
				if (octx) {
					octx.drawImage(pieceCanvas, 0, 0);
				}

				if (parallaxShardLayer) {
					parallaxShardLayer.appendChild(overlayCanvas);
				}
				tessellationLayer.appendChild(pieceCanvas);
				tessellationPieces.push({
					heroEl: pieceCanvas,
					parallaxEl: overlayCanvas,
					yNorm: comp.yNorm,
					jitter: ((i * 37) % 100) / 100
				});
			}

			if (!tessellationPieces.length) {
				buildFallbackTessellation();
			}
		}

		function tryLoadTessellationImage(paths, index, buildToken) {
			if (index >= paths.length) {
				if (buildToken === tessellationBuildToken) {
					buildFallbackTessellation();
					updateTessellationOnScroll();
				}
				return;
			}

			const img = new Image();
			img.onload = () => {
				extractPiecesFromImage(img, buildToken);
				updateTessellationOnScroll();
			};
			img.onerror = () => {
				tryLoadTessellationImage(paths, index + 1, buildToken);
			};
			img.src = `${paths[index]}?v=1`;
		}

		function buildTessellationFromImage() {
			tessellationBuildToken += 1;
			const buildToken = tessellationBuildToken;
			tryLoadTessellationImage(TESSELLATION_IMAGE_CANDIDATES, 0, buildToken);
		}

		function updateTessellationOnScroll() {
			if (!heroSection || !tessellationPieces.length) {
				return;
			}

			const rect = heroSection.getBoundingClientRect();
			const progress = clamp(-rect.top / heroSection.offsetHeight, 0, 1);

			tessellationPieces.forEach((piece) => {
				const delay = (1 - piece.yNorm) * 0.58;
				const local = clamp((progress - delay) / (1 - delay), 0, 1);
				const drop = local * (heroSection.offsetHeight * (0.9 + piece.jitter * 0.45));
				const sway = (piece.jitter - 0.5) * 34 * local;
				const rotate = (piece.jitter - 0.5) * 9 * local;
				piece.heroEl.style.transform = `translate(${sway}px, ${drop}px) rotate(${rotate}deg)`;
				piece.heroEl.style.opacity = String(1 - local * 0.92);

				if (piece.parallaxEl) {
					const startAbove = -parallaxSection.offsetHeight * (0.58 + piece.jitter * 0.16);
					const overlayY = startAbove + local * (parallaxSection.offsetHeight * (1.22 + piece.jitter * 0.2));
					const overlayRotate = rotate * 0.8;
					const overlayOpacity = clamp(local * 1.2, 0, 0.78);
					piece.parallaxEl.style.transform = `translate(${sway * 0.65}px, ${overlayY}px) rotate(${overlayRotate}deg)`;
					piece.parallaxEl.style.opacity = String(overlayOpacity);
				}
			});
		}

		function updateVideoParallaxOffset() {
			const rect = parallaxSection.getBoundingClientRect();
			const sectionCenter = rect.top + rect.height / 2;
			const viewportCenter = window.innerHeight / 2;
			const shift = (sectionCenter - viewportCenter) * -0.12;
			parallaxSection.style.setProperty("--parallax-shift", shift.toFixed(2));
		}

		function onScrollEffects() {
			snapToParallaxOnThreshold();
			hairlineCollapseOnScrollAway();
			updateTessellationOnScroll();
			updateVideoParallaxOffset();
		}

		function renderButtons() {
			repoCarousel.innerHTML = repoVideos
				.map((repo, index) => `
					<button class="repo-button${index === current ? " active" : ""}" data-index="${index}" type="button">
						<span class="repo-full">${repo.name}</span>
					</button>
				`)
				.join("");

			repoCarousel.querySelectorAll(".repo-button").forEach((button) => {
				button.addEventListener("mouseenter", () => {
					hoveredIndex = Number(button.dataset.index);
					updateButtonState();
				});

				button.addEventListener("mouseleave", () => {
					hoveredIndex = -1;
					updateButtonState();
				});

				button.addEventListener("click", () => {
					current = Number(button.dataset.index);
					hoveredIndex = -1;
					render();
				});
			});
		}

		async function fetchReposForUser(user) {
			const response = await fetch(`https://api.github.com/users/${user}/repos?sort=updated&per_page=100`);
			if (!response.ok) {
				throw new Error("Unable to load repositories for user");
			}
			const repos = await response.json();
			return repos
				.filter((repo) => repo.name)
				.map((repo) => ({
					owner: repo.owner.login,
					name: repo.name,
					description: repo.description || "No repository description available.",
					repoUrl: repo.html_url,
					homepage: repo.homepage || ""
				}));
		}

		async function loadRepos() {
			for (const user of candidateUsers) {
				try {
					const repos = await fetchReposForUser(user);
					if (repos.length) {
						repoVideos = repos;
						break;
					}
				} catch (error) {
					continue;
				}
			}

			if (!repoVideos.length) {
				repoVideos = [
					{
						owner: "hpipyT",
						name: "hpipyt.github.io",
						description: "Fallback repository entry.",
						repoUrl: "https://github.com/hpipyT/hpipyt.github.io",
						homepage: ""
					}
				];
			}

			renderButtons();
			render();
		}

		function unlockAndPlay() {
			togglePlayPauseInExpanded();
		}

		const sectionObserver = new IntersectionObserver(
			(entries) => {
				entries.forEach((entry) => {
					if (entry.target === parallaxSection && entry.intersectionRatio < 0.32) {
						pauseAndCollapse();
					}
				});
			},
			{ threshold: [0, 0.15, 0.32, 0.55, 0.8] }
		);
		sectionObserver.observe(parallaxSection);

		parallaxSection.addEventListener("click", (event) => {
			const target = event.target;
			if (!(target instanceof Element)) {
				return;
			}
			if (target.closest(".repo-button") || target.closest(".side-arrow") || target.closest(".repo-link")) {
				return;
			}
			unlockAndPlay();
		});

		prevBtn.addEventListener("click", (event) => {
			event.stopPropagation();
			move(-1);
		});
		nextBtn.addEventListener("click", (event) => {
			event.stopPropagation();
			move(1);
		});
		window.addEventListener("scroll", onScrollEffects, { passive: true });
		let resizeTimer;
		window.addEventListener("resize", () => {
			window.clearTimeout(resizeTimer);
			resizeTimer = window.setTimeout(() => {
				buildTessellationFromImage();
				updateVideoParallaxOffset();
			}, 120);
		});

		buildTessellationFromImage();
		loadRepos();
		updateTessellationOnScroll();
		updateVideoParallaxOffset();
	</script>

</body>
</html>

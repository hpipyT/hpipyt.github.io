<!DOCTYPE html>
<html>
<head>
<title>Parallax Demo</title>
<style>
	:root {
		--bg: #f4f1ea;
		--ink: #1f2937;
		--accent: #c2410c;
		--surface: #fff;
		--muted: #4b5563;
	}

	* {
		box-sizing: border-box;
	}

	body {
		margin: 0;
		font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
		color: var(--ink);
		background: var(--bg);
		line-height: 1.6;
		overflow-x: hidden;
	}

	.hero {
		min-height: 100vh;
		display: grid;
		place-items: center;
		padding: 2rem;
		text-align: center;
		background: linear-gradient(130deg, #fffaf0 0%, #f5d0a9 100%);
	}

	.hero h1 {
		margin: 0;
		font-size: clamp(2rem, 6vw, 4rem);
		letter-spacing: 0.04em;
	}

	.hero p {
		max-width: 60ch;
		margin: 1rem auto 0;
		font-size: clamp(1rem, 2.5vw, 1.25rem);
	}

	.parallax {
		position: relative;
		min-height: 76vh;
		--video-thumb: url("https://picsum.photos/1600/900?grayscale");
		--mouse-x: 50%;
		--mouse-y: 50%;
		background-image: linear-gradient(130deg, rgb(31 41 55 / 0.78), rgb(146 64 14 / 0.66)), var(--video-thumb);
		background-attachment: fixed;
		background-position: center;
		background-repeat: no-repeat;
		background-size: cover;
		display: grid;
		place-items: center;
		padding: 1.5rem clamp(2.8rem, 8vw, 5.5rem);
		overflow: hidden;
	}

	.thumb-reveal {
		position: absolute;
		inset: 0;
		pointer-events: none;
		background-image: linear-gradient(130deg, rgb(255 255 255 / 0.12), rgb(255 255 255 / 0.02)), var(--video-thumb);
		background-attachment: fixed;
		background-position: center;
		background-repeat: no-repeat;
		background-size: cover;
		opacity: 0.72;
		mask-image: radial-gradient(circle 130px at var(--mouse-x) var(--mouse-y), rgb(0 0 0 / 0.95) 0%, rgb(0 0 0 / 0.2) 42%, transparent 82%);
		-webkit-mask-image: radial-gradient(circle 130px at var(--mouse-x) var(--mouse-y), rgb(0 0 0 / 0.95) 0%, rgb(0 0 0 / 0.2) 42%, transparent 82%);
		z-index: 0;
	}

	.parallax-stage {
		width: min(1080px, 100%);
		background: rgb(15 23 42 / 0.62);
		border: 1px solid rgb(255 255 255 / 0.18);
		border-radius: 0.85rem;
		padding: 1rem;
		backdrop-filter: blur(4px);
		box-shadow: 0 18px 44px rgb(0 0 0 / 0.3);
		position: relative;
		z-index: 1;
	}

	.video-title {
		margin: 0 0 0.55rem;
		color: #fff;
		font-size: clamp(1rem, 1.8vw, 1.35rem);
	}

	.video-wrap {
		position: relative;
		width: 100%;
		padding-top: 56.25%;
		border-radius: 0.7rem;
		overflow: hidden;
		background: #111827;
	}

	.video-wrap iframe {
		position: absolute;
		inset: 0;
		width: 100%;
		height: 100%;
		border: 0;
	}

	.video-overlay {
		position: absolute;
		inset: 0;
		display: grid;
		place-items: center;
		background-image: linear-gradient(130deg, rgb(15 23 42 / 0.54), rgb(124 45 18 / 0.44)), var(--video-thumb);
		background-size: cover;
		background-position: center;
		color: #fff;
		font-weight: 700;
		letter-spacing: 0.02em;
		cursor: pointer;
		opacity: 1;
		transition: opacity 750ms ease;
	}

	.video-overlay.fade-out {
		opacity: 0;
		pointer-events: none;
	}

	.video-overlay span {
		padding: 0.48rem 0.88rem;
		border-radius: 999px;
		background: rgb(15 23 42 / 0.58);
		border: 1px solid rgb(255 255 255 / 0.24);
	}

	.side-arrow {
		position: absolute;
		top: 50%;
		transform: translateY(-50%);
		width: 2.7rem;
		height: 2.7rem;
		border: 0;
		border-radius: 999px;
		background: rgb(255 247 237 / 0.92);
		color: #7c2d12;
		font-size: 1.4rem;
		line-height: 1;
		cursor: pointer;
		box-shadow: 0 6px 16px rgb(0 0 0 / 0.22);
		transition: transform 140ms ease, background-color 140ms ease;
		z-index: 2;
	}

	.side-arrow:hover {
		background: #fdba74;
		transform: translateY(-50%) scale(1.04);
	}

	.side-arrow.left {
		left: 0.9rem;
	}

	.side-arrow.right {
		right: 0.9rem;
	}

	.content {
		min-height: 40vh;
		padding: 0.85rem 1.25rem 3rem;
		display: grid;
		place-items: center;
	}

	.content-shell {
		width: min(1080px, 96vw);
		background: var(--surface);
		border-radius: 0.85rem;
		padding: 1.2rem;
		box-shadow: 0 10px 30px rgb(0 0 0 / 0.08);
	}

	.content-shell h2 {
		margin: 0;
		font-size: 1.2rem;
		text-align: center;
	}

	.content-shell p {
		margin: 0.35rem 0 1rem;
		color: var(--muted);
		font-size: 0.95rem;
		text-align: center;
	}

	.carousel-frame {
		width: min(34vw, 680px);
		min-width: min(520px, 100%);
		max-width: 100%;
		margin: 0 auto;
	}

	.repo-carousel {
		display: flex;
		gap: 0;
		overflow: hidden;
		border: 1px solid #fdba74;
		border-radius: 0.72rem;
		background: #fff7ed;
	}

	.repo-button {
		border: 0;
		border-right: 1px solid #fdba74;
		background: #ffedd5;
		color: #9a3412;
		padding: 0.7rem 0.42rem;
		font-size: 0.86rem;
		font-weight: 600;
		cursor: pointer;
		white-space: nowrap;
		flex: 1 1 0;
		min-width: 0;
		transition: flex 210ms ease, background-color 160ms ease, color 160ms ease, padding 210ms ease;
		overflow: hidden;
		display: flex;
		align-items: center;
		justify-content: center;
	}

	.repo-button:last-child {
		border-right: 0;
	}

	.repo-button .repo-mini {
		opacity: 0.85;
	}

	.repo-button .repo-full {
		display: none;
		overflow: hidden;
		text-overflow: ellipsis;
	}

	.repo-button.active,
	.repo-button.hovered {
		flex: 5 1 0;
		justify-content: flex-start;
		padding-left: 0.8rem;
		background: #fdba74;
		color: #7c2d12;
	}

	.repo-button.active .repo-mini,
	.repo-button.hovered .repo-mini {
		display: none;
	}

	.repo-button.active .repo-full,
	.repo-button.hovered .repo-full {
		display: block;
	}

	.repo-button.active {
		font-weight: 700;
	}

	.repo-meta {
		margin-top: 1rem;
		font-weight: 700;
		font-size: 1rem;
	}

	.repo-link {
		display: inline-block;
		margin-top: 0.35rem;
		text-decoration: none;
		color: #9a3412;
		font-weight: 600;
	}

	.readme {
		margin-top: 0.9rem;
		padding: 1rem;
		border-radius: 0.7rem;
		background: #fffdf7;
		border: 1px solid #f3e8d4;
		max-height: 38vh;
		overflow: auto;
		white-space: pre-wrap;
		font-size: 0.92rem;
	}

	.readme.loading {
		color: #6b7280;
		font-style: italic;
	}

	@media (max-width: 900px) {
		.parallax {
			background-attachment: scroll;
			padding: 1.25rem 1rem 1.5rem;
		}

		.thumb-reveal {
			background-attachment: scroll;
		}

		.carousel-frame {
			min-width: 100%;
			width: 100%;
		}

		.side-arrow {
			top: auto;
			bottom: 0.7rem;
			transform: none;
		}

		.side-arrow:hover {
			transform: scale(1.04);
		}
	}
</style>
</head>
<body>
	<section class="hero">
		<div>
			<h1>Parallax Scroll Effect</h1>
			<p>Scroll down to see the background move at a different pace than the content.</p>
		</div>
	</section>

	<section id="videoParallax" class="parallax" aria-label="Parallax video section">
		<div id="thumbReveal" class="thumb-reveal" aria-hidden="true"></div>
		<button id="prevBtn" class="side-arrow left" type="button" aria-label="Previous repository">&#8249;</button>
		<div class="parallax-stage">
			<h2 id="videoTitle" class="video-title">Loading repositories...</h2>
			<div class="video-wrap">
				<iframe
					id="videoPlayer"
					src="https://www.youtube.com/embed/dQw4w9WgXcQ?rel=0&modestbranding=1"
					title="Project video"
					allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
					allowfullscreen
				></iframe>
				<button id="videoOverlay" class="video-overlay" type="button" aria-label="Reveal and play video">
					<span>Click To Reveal And Play</span>
				</button>
			</div>
		</div>
		<button id="nextBtn" class="side-arrow right" type="button" aria-label="Next repository">&#8250;</button>
	</section>

	<section class="content">
		<div class="content-shell">
			<h2>Repository Video Carousel</h2>
			<p>Hover cells to preview names. Click one to switch video and README.</p>
			<div class="carousel-frame">
				<div id="repoCarousel" class="repo-carousel" aria-label="Repository buttons"></div>
			</div>
			<div id="repoMeta" class="repo-meta" aria-live="polite"></div>
			<a id="repoLink" class="repo-link" href="#" target="_blank" rel="noopener noreferrer">Open repository</a>
			<div id="readmeText" class="readme loading">Loading README...</div>
		</div>
	</section>

	<script>
		const candidateUsers = ["hpipyT", "Hpipyt", "hpipy"];
		const fallbackEmbedIds = ["dQw4w9WgXcQ", "ysz5S6PUM-U", "tgbNymZ7vqY"];

		const parallaxSection = document.getElementById("videoParallax");
		const videoTitle = document.getElementById("videoTitle");
		const videoPlayer = document.getElementById("videoPlayer");
		const videoOverlay = document.getElementById("videoOverlay");
		const repoCarousel = document.getElementById("repoCarousel");
		const repoMeta = document.getElementById("repoMeta");
		const repoLink = document.getElementById("repoLink");
		const readmeText = document.getElementById("readmeText");
		const thumbReveal = document.getElementById("thumbReveal");
		const prevBtn = document.getElementById("prevBtn");
		const nextBtn = document.getElementById("nextBtn");

		const readmeCache = new Map();
		const videoCache = new Map();
		const thumbCache = new Map();
		let current = 0;
		let repoVideos = [];
		let autoSnapCooldown = false;
		let lastScrollY = window.scrollY;
		let hoveredIndex = -1;
		let renderToken = 0;
		let isPlayerUnlocked = false;
		let activeEmbedBase = "https://www.youtube.com/embed/dQw4w9WgXcQ";

		function normalizeIndex(index) {
			const total = repoVideos.length;
			return (index + total) % total;
		}

		function embedFromVideoId(videoId) {
			return `https://www.youtube.com/embed/${videoId}`;
		}

		function parseEmbedVideoId(embedUrl) {
			const match = embedUrl.match(/\/embed\/([^?&]+)/i);
			return match ? match[1] : null;
		}

		function buildEmbedUrl(base, autoplay) {
			const suffix = autoplay ? "?autoplay=1&rel=0&modestbranding=1" : "?rel=0&modestbranding=1";
			return `${base}${suffix}`;
		}

		function thumbFromVideoId(videoId) {
			return `https://img.youtube.com/vi/${videoId}/maxresdefault.jpg`;
		}

		function setParallaxThumb(url) {
			parallaxSection.style.setProperty("--video-thumb", `url('${url}')`);
		}

		function escapeHtml(text) {
			const span = document.createElement("span");
			span.textContent = text;
			return span.innerHTML;
		}

		function extractYoutubeId(url) {
			if (!url) {
				return null;
			}

			try {
				const parsed = new URL(url);
				const host = parsed.hostname.replace("www.", "").toLowerCase();

				if (host === "youtu.be") {
					return parsed.pathname.slice(1) || null;
				}

				if (host === "youtube.com" || host === "m.youtube.com") {
					if (parsed.pathname === "/watch") {
						return parsed.searchParams.get("v");
					}
					if (parsed.pathname.startsWith("/embed/")) {
						return parsed.pathname.split("/")[2] || null;
					}
				}
			} catch (error) {
				return null;
			}

			return null;
		}

		function decodeBase64Utf8(base64Value) {
			const raw = atob(base64Value);
			const bytes = Uint8Array.from(raw, (char) => char.charCodeAt(0));
			return new TextDecoder("utf-8").decode(bytes);
		}

		function updateButtonState() {
			const buttons = repoCarousel.querySelectorAll(".repo-button");
			buttons.forEach((button, index) => {
				button.classList.toggle("active", index === current);
				button.classList.toggle("hovered", index === hoveredIndex && hoveredIndex !== current);
			});
		}

		async function getReadme(repo) {
			const key = `${repo.owner}/${repo.name}`;
			if (readmeCache.has(key)) {
				return readmeCache.get(key);
			}

			try {
				const response = await fetch(`https://api.github.com/repos/${repo.owner}/${repo.name}/readme`);
				if (!response.ok) {
					throw new Error("README not found");
				}

				const payload = await response.json();
				const content = payload.content ? decodeBase64Utf8(payload.content.replace(/\n/g, "")) : "README unavailable.";
				readmeCache.set(key, content);
				return content;
			} catch (error) {
				const fallback = "README not available for this repository.";
				readmeCache.set(key, fallback);
				return fallback;
			}
		}

		async function resolveVideoEmbed(repo, index) {
			const key = `${repo.owner}/${repo.name}`;
			if (videoCache.has(key)) {
				return videoCache.get(key);
			}

			const homepageId = extractYoutubeId(repo.homepage || "");
			if (homepageId) {
				const homepageEmbed = embedFromVideoId(homepageId);
				videoCache.set(key, homepageEmbed);
				return homepageEmbed;
			}

			const readme = await getReadme(repo);
			const match = readme.match(/https?:\/\/(?:www\.)?(?:youtube\.com\/watch\?v=[^\s)\]]+|youtu\.be\/[^\s)\]]+|youtube\.com\/embed\/[^\s)\]]+)/i);
			const readmeId = match ? extractYoutubeId(match[0]) : null;
			const embed = readmeId
				? embedFromVideoId(readmeId)
				: embedFromVideoId(fallbackEmbedIds[index % fallbackEmbedIds.length]);
			videoCache.set(key, embed);
			return embed;
		}

		async function resolveThumbnail(repo, index) {
			const key = `${repo.owner}/${repo.name}`;
			if (thumbCache.has(key)) {
				return thumbCache.get(key);
			}

			const embed = await resolveVideoEmbed(repo, index);
			const videoId = parseEmbedVideoId(embed);
			const thumb = videoId ? thumbFromVideoId(videoId) : "https://picsum.photos/1600/900?grayscale";
			thumbCache.set(key, thumb);
			return thumb;
		}

		async function render() {
			if (!repoVideos.length) {
				return;
			}

			const token = ++renderToken;

			const active = repoVideos[current];
			videoTitle.textContent = active.name;
			repoMeta.textContent = active.description || "No repository description available.";
			repoLink.href = active.repoUrl;
			repoLink.textContent = `Open ${active.name} on GitHub`;

			hoveredIndex = -1;
			updateButtonState();

			readmeText.classList.add("loading");
			readmeText.textContent = "Loading README...";
			videoOverlay.classList.remove("fade-out");
			isPlayerUnlocked = false;

			const embed = await resolveVideoEmbed(active, current);
			if (token !== renderToken) {
				return;
			}

			activeEmbedBase = embed;
			videoPlayer.src = buildEmbedUrl(activeEmbedBase, false);
			videoPlayer.title = `${active.name} video`;

			const thumb = await resolveThumbnail(active, current);
			if (token !== renderToken) {
				return;
			}
			setParallaxThumb(thumb);

			const readme = await getReadme(active);
			if (token !== renderToken) {
				return;
			}
			readmeText.classList.remove("loading");
			readmeText.innerHTML = escapeHtml(readme);
		}

		function move(step) {
			if (!repoVideos.length) {
				return;
			}
			current = normalizeIndex(current + step);
			render();
		}

		function snapToParallaxOnThreshold() {
			const currentY = window.scrollY;
			const scrollingDown = currentY > lastScrollY;
			lastScrollY = currentY;

			if (!scrollingDown || autoSnapCooldown) {
				return;
			}

			const stage = parallaxSection.querySelector(".parallax-stage");
			if (!stage) {
				return;
			}

			const rect = parallaxSection.getBoundingClientRect();
			const inThreshold = rect.top <= window.innerHeight * 0.62 && rect.top >= window.innerHeight * 0.35;
			if (inThreshold) {
				autoSnapCooldown = true;
				const stageRect = stage.getBoundingClientRect();
				const absoluteStageCenter = window.scrollY + stageRect.top + stageRect.height / 2;
				const targetY = Math.max(0, absoluteStageCenter - window.innerHeight / 2);
				window.scrollTo({ top: targetY, behavior: "smooth" });
				setTimeout(() => {
					autoSnapCooldown = false;
				}, 1050);
			}
		}

		function renderButtons() {
			repoCarousel.innerHTML = repoVideos
				.map((repo, index) => `
					<button class="repo-button${index === current ? " active" : ""}" data-index="${index}" type="button">
						<span class="repo-mini">${index + 1}</span>
						<span class="repo-full">${repo.name}</span>
					</button>
				`)
				.join("");

			repoCarousel.querySelectorAll(".repo-button").forEach((button) => {
				button.addEventListener("mouseenter", () => {
					hoveredIndex = Number(button.dataset.index);
					updateButtonState();
				});

				button.addEventListener("mouseleave", () => {
					hoveredIndex = -1;
					updateButtonState();
				});

				button.addEventListener("click", () => {
					current = Number(button.dataset.index);
					render();
				});
			});
		}

		async function fetchReposForUser(user) {
			const response = await fetch(`https://api.github.com/users/${user}/repos?sort=updated&per_page=100`);
			if (!response.ok) {
				throw new Error("Unable to load repositories for user");
			}
			const repos = await response.json();
			return repos
				.filter((repo) => repo.name)
				.map((repo) => ({
					owner: repo.owner.login,
					name: repo.name,
					description: repo.description || "No repository description available.",
					repoUrl: repo.html_url,
					homepage: repo.homepage || ""
				}));
		}

		async function loadRepos() {
			for (const user of candidateUsers) {
				try {
					const repos = await fetchReposForUser(user);
					if (repos.length) {
						repoVideos = repos;
						break;
					}
				} catch (error) {
					continue;
				}
			}

			if (!repoVideos.length) {
				repoVideos = [
					{
						owner: "hpipyT",
						name: "hpipyt.github.io",
						description: "Fallback repository entry.",
						repoUrl: "https://github.com/hpipyT/hpipyt.github.io",
						homepage: ""
					}
				];
			}

			renderButtons();
			render();
		}

		function unlockAndPlay() {
			if (isPlayerUnlocked) {
				return;
			}
			isPlayerUnlocked = true;
			videoOverlay.classList.add("fade-out");
			videoPlayer.src = buildEmbedUrl(activeEmbedBase, true);
		}

		parallaxSection.addEventListener("mousemove", (event) => {
			const rect = parallaxSection.getBoundingClientRect();
			const x = ((event.clientX - rect.left) / rect.width) * 100;
			const y = ((event.clientY - rect.top) / rect.height) * 100;
			parallaxSection.style.setProperty("--mouse-x", `${x}%`);
			parallaxSection.style.setProperty("--mouse-y", `${y}%`);
		});

		videoOverlay.addEventListener("click", unlockAndPlay);

		prevBtn.addEventListener("click", () => move(-1));
		nextBtn.addEventListener("click", () => move(1));
		window.addEventListener("scroll", snapToParallaxOnThreshold, { passive: true });

		loadRepos();
	</script>

</body>
</html>

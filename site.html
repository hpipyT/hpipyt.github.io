<!DOCTYPE html>
<html>
<head>
<title>Parallax Demo</title>
<style>
	:root {
		--bg: #f4f1ea;
		--ink: #1f2937;
		--accent: #c2410c;
	}

	* {
		box-sizing: border-box;
	}

	body {
		margin: 0;
		font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
		color: var(--ink);
		background: var(--bg);
		line-height: 1.6;
	}

	.hero {
		min-height: 100vh;
		display: grid;
		place-items: center;
		padding: 2rem;
		text-align: center;
		background: linear-gradient(130deg, #fffaf0 0%, #f5d0a9 100%);
	}

	.hero h1 {
		margin: 0;
		font-size: clamp(2rem, 6vw, 4rem);
		letter-spacing: 0.04em;
	}

	.hero p {
		max-width: 60ch;
		margin: 1rem auto 0;
		font-size: clamp(1rem, 2.5vw, 1.25rem);
	}

	.parallax {
		min-height: 65vh;
		background-image: url("https://picsum.photos/1600/900?grayscale");
		background-attachment: fixed;
		background-position: center;
		background-repeat: no-repeat;
		background-size: cover;
		display: grid;
		place-items: center;
	}

	.parallax-badge {
		background: rgb(0 0 0 / 0.55);
		color: #fff;
		padding: 0.75rem 1rem;
		border-radius: 0.5rem;
		font-weight: 600;
		letter-spacing: 0.08em;
		text-transform: uppercase;
	}

	.content {
		min-height: 50vh;
		display: grid;
		place-items: center;
		padding: 2rem;
	}

	.content article {
		max-width: 68ch;
		background: #fff;
		border-radius: 0.75rem;
		padding: 1.5rem;
		box-shadow: 0 10px 30px rgb(0 0 0 / 0.08);
	}

	.placeholder-image {
		margin-top: 1rem;
		width: 100%;
		border-radius: 0.5rem;
		display: block;
	}

	@media (max-width: 900px) {
		.parallax {
			background-attachment: scroll;
		}
	}
</style>
</head>
<body>
	<section class="hero">
		<div>
			<h1>Parallax Scroll Effect</h1>
			<p>Scroll down to see the background move at a different pace than the content.</p>
		</div>
	</section>

	<section class="parallax" aria-label="Parallax background image">
		<div class="parallax-badge">Placeholder Background</div>
	</section>

	<section class="content">
		<article>
			<h2>Placeholder Image Section</h2>
			<p>
				This image is a temporary placeholder so you can swap in your own media later.
			</p>
			<img
				class="placeholder-image"
				src="https://picsum.photos/1200/600"
				alt="Placeholder landscape image"
			>
		</article>
	</section>

</body>
</html>
